name: flutter_application_2
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  rename: ^3.0.0
  google_fonts: ^6.1.0
  lucide_icons: ^0.257.0
  flutter_animate: ^4.5.0
  image_picker: ^1.0.5
  camera: ^0.10.5
  permission_handler: ^11.0.1
  collection: ^1.18.0
  shared_preferences: ^2.2.2
  uuid: ^4.3.3
  share_plus: ^7.2.1
  path_provider: ^2.1.1
  tflite_flutter:
    git:
      url: https://github.com/tensorflow/flutter-tflite.git
      ref: main
  image: ^4.1.3
  provider: ^6.1.1

dependency_overrides:
  win32: ^5.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  rename: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/models/model.tflite  # ONLY disease model

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.jpeg"
  min_sdk_android: 21
  remove_alpha_ios: true